<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الآيباد - حروف وألوف</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="branding.js"></script>
    <style>
        :root {
            --accent: #00a651;
            --accent-dark: #005f2e;
            --ok: #28a745;
            --bad: #dc3545;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            min-height: 100vh;
            color: white;
            background-color: #050806;
            background-image:
                radial-gradient(circle at 50% 0%, rgba(0, 70, 25, 0.15) 0%, rgba(5, 8, 6, 0.7) 65%),
                url('host-bg.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 900px;
            background: rgba(10, 10, 10, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        #login-screen { max-width: 460px; text-align: center; display: flex; flex-direction: column; gap: 14px; }
        .logo-row { display: flex; direction: ltr; justify-content: center; align-items: center; gap: 16px; min-height: 90px; }
        .logo-row img { width: 170px; max-width: 100%; height: auto; filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.25)); }
        body.has-logo2 .logo-row img { width: 130px; }
        #login-screen h1 { margin: 0; font-size: 2rem; text-shadow: 0 0 18px rgba(0, 166, 81, 0.6); }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            font-family: 'Cairo';
            font-size: 1.3rem;
            font-weight: 900;
            text-align: center;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            outline: none;
        }
        input[type="text"]:focus { border-color: var(--accent); }
        #code-input { font-size: 1.6rem; letter-spacing: 8px; }

        .primary-btn {
            width: 100%;
            padding: 18px;
            font-family: 'Cairo';
            font-size: 1.4rem;
            font-weight: 900;
            color: white;
            background: linear-gradient(45deg, var(--accent), var(--accent-dark));
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
        }
        .primary-btn:disabled { opacity: 0.4; cursor: default; }

        #error-msg { color: #ff8a8a; min-height: 24px; font-weight: bold; }

        .team-pick-label { font-weight: 900; font-size: 1.1rem; }
        .team-row { display: flex; gap: 14px; }
        .team-btn {
            flex: 1;
            min-height: 78px;
            padding: 12px;
            font-family: 'Cairo';
            font-size: clamp(1.2rem, 2.6vw, 1.8rem);
            font-weight: 900;
            color: white;
            background: rgba(255, 255, 255, 0.08);
            border: 3px solid var(--team-color, rgba(255, 255, 255, 0.3));
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.1s, background 0.15s, box-shadow 0.15s;
        }
        .team-btn:active { transform: scale(0.98); }
        .team-btn.selected { background: var(--team-color); box-shadow: 0 0 22px var(--team-color); }
        .team-btn:disabled { opacity: 0.5; cursor: default; }

        #main-screen { display: none; }

        .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; font-weight: bold; }
        .topbar .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); margin-left: 8px; }
        .topbar button { font-family: 'Cairo'; font-weight: bold; color: white; background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 12px; padding: 8px 16px; cursor: pointer; }
        #my-team-chip { padding: 6px 18px; border-radius: 30px; border: 2px solid var(--team-color); background: rgba(255, 255, 255, 0.08); font-weight: 900; }

        #winner-banner {
            display: none;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 900;
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 16px;
            background: rgba(0, 166, 81, 0.2);
            border: 2px solid var(--accent);
        }

        #waiting { text-align: center; font-size: 1.8rem; font-weight: 700; padding: 60px 10px; opacity: 0.85; }

        #question-view { display: none; }

        .letter-chip {
            display: inline-block;
            padding: 6px 22px;
            font-size: 1.4rem;
            font-weight: 900;
            border-radius: 30px;
            background: var(--accent);
            margin-bottom: 12px;
        }

        #q-text { font-size: clamp(1.6rem, 3.4vw, 2.4rem); font-weight: 900; line-height: 1.35; margin: 4px 0 22px 0; min-height: 2.7em; }

        #options { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .opt {
            min-height: 96px;
            padding: 16px;
            font-family: 'Cairo';
            font-size: clamp(1.4rem, 3vw, 2.1rem);
            font-weight: 900;
            color: white;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.1s, background 0.15s, border-color 0.15s;
        }
        .opt:active { transform: scale(0.98); }
        .opt.selected { background: rgba(0, 166, 81, 0.28); border-color: var(--accent); box-shadow: 0 0 20px rgba(0, 166, 81, 0.45); }
        .opt.correct { background: rgba(40, 167, 69, 0.85); border-color: var(--ok); }
        .opt.wrong { background: rgba(220, 53, 69, 0.85); border-color: var(--bad); }
        .opt:disabled { cursor: default; }

        #confirm-btn { margin-top: 20px; }

        #feedback { text-align: center; font-size: 1.3rem; font-weight: bold; min-height: 32px; margin-top: 14px; }

        #answer-status {
            text-align: center;
            font-size: 1.25rem;
            font-weight: 900;
            padding: 10px 14px;
            margin-bottom: 16px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #answer-status.ready { background: rgba(0, 166, 81, 0.25); border-color: var(--accent); }
        #answer-status.blocked { background: rgba(220, 53, 69, 0.18); border-color: rgba(220, 53, 69, 0.6); }
        #answer-status:empty { display: none; }

        @media (max-width: 560px) { #options { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div id="login-screen" class="card">
        <div class="logo-row">
            <img data-brand="2" alt="" style="display:none;">
            <img data-brand="1" alt="Logo" style="visibility:hidden;">
        </div>
        <h1>انضم من الآيباد</h1>
        <input type="text" id="code-input" inputmode="numeric" maxlength="4" placeholder="كود اللعبة" autocomplete="off">
        <input type="text" id="name-input" maxlength="20" placeholder="الاسم" value="آيباد" autocomplete="off">
        <div class="team-pick-label">اختر فريقك</div>
        <div class="team-row">
            <button type="button" class="team-btn" id="login-team-green" onclick="pickLoginTeam('green')">الفريق الأخضر</button>
            <button type="button" class="team-btn" id="login-team-red" onclick="pickLoginTeam('red')">الفريق الأحمر</button>
        </div>
        <button class="primary-btn" id="connect-btn" onclick="connectFromInput()">دخول</button>
        <div id="error-msg"></div>
    </div>

    <div id="main-screen" class="card">
        <div class="topbar">
            <div><span class="dot"></span>كود اللعبة: <span id="code-label"></span></div>
            <div id="my-team-chip"></div>
            <button onclick="leaveGame()">خروج</button>
        </div>

        <div id="winner-banner"></div>

        <div id="waiting">بانتظار السؤال من المضيف...</div>

        <div id="question-view">
            <div class="letter-chip" id="letter-chip"></div>
            <div id="q-text"></div>
            <div id="answer-status"></div>
            <div id="options"></div>
            <button class="primary-btn" id="confirm-btn" onclick="confirmPick()" disabled>تأكيد الإجابة</button>
            <div id="feedback"></div>
        </div>
    </div>

    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyBWShBcWNHm64xliJ-OlEm_P-0RFRY-x2s",
            authDomain: "hroof-837b6.firebaseapp.com",
            projectId: "hroof-837b6",
            storageBucket: "hroof-837b6.firebasestorage.app",
            messagingSenderId: "1061358003828",
            appId: "1:1061358003828:web:e85a22b79440a660905321",
            measurementId: "G-4B1CHV1F4R"
        };

        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();
        Branding.init(db);

        var TYPE_SPEED_MS = 90;

        var gameId = null;
        var myName = 'آيباد';
        var myTeam = null;
        var myPlayerRef = null;
        var unsubscribe = null;
        var unsubscribePlayer = null;
        var currentSeq = null;
        var selectedIndex = null;
        var sent = false;
        var buzz = { locked: false, team: '' };
        var timeUp = false;
        var typeTimer = null;
        var typedText = '';
        var typedCount = 0;
        var typedFrozen = false;
        var teamsInfo = { green: { name: 'الفريق الأخضر', color: '#00ff44' }, red: { name: 'الفريق الأحمر', color: '#ff0000' } };

        function $(id) { return document.getElementById(id); }
        function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
        function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
        function unstore(k) { try { localStorage.removeItem(k); } catch (e) {} }

        // ---------- team labels ----------
        function applyTeams(info) {
            if (!info || !info.green || !info.red) return;
            teamsInfo = info;
            ['green', 'red'].forEach(function (t) {
                $('login-team-' + t).textContent = teamsInfo[t].name;
                $('login-team-' + t).style.setProperty('--team-color', teamsInfo[t].color);
            });
            updateMyTeamChip();
        }

        function updateMyTeamChip() {
            var chip = $('my-team-chip');
            if (!myTeam) { chip.textContent = ''; return; }
            chip.textContent = teamsInfo[myTeam].name;
            chip.style.setProperty('--team-color', teamsInfo[myTeam].color);
        }

        function pickLoginTeam(t) {
            myTeam = t;
            ['green', 'red'].forEach(function (x) { $('login-team-' + x).classList.toggle('selected', x === t); });
        }

        function fetchTeamsFor(code) {
            db.collection('sessions').doc(code).get().then(function (doc) {
                if (doc.exists && doc.data().teams) applyTeams(doc.data().teams);
            }).catch(function () {});
        }

        applyTeams(teamsInfo);
        Branding.onTeams(applyTeams);

        $('code-input').addEventListener('input', function () {
            this.value = this.value.replace(/[^0-9]/g, '');
            if (this.value.length === 4) fetchTeamsFor(this.value);
        });

        // ---------- join ----------
        function connectFromInput() {
            var code = $('code-input').value.trim();
            var name = $('name-input').value.trim();
            if (code.length !== 4) { $('error-msg').textContent = 'أدخل كود اللعبة المكون من 4 أرقام'; return; }
            if (!name) { $('error-msg').textContent = 'اكتب الاسم'; return; }
            if (!myTeam) { $('error-msg').textContent = 'اختر فريقك'; return; }
            myName = name;
            connect(code);
        }

        function connect(code) {
            $('error-msg').textContent = '';
            $('connect-btn').disabled = true;
            var first = true;
            if (unsubscribe) { unsubscribe(); unsubscribe = null; }
            unsubscribe = db.collection('sessions').doc(code).onSnapshot(function (doc) {
                if (first) {
                    first = false;
                    $('connect-btn').disabled = false;
                    if (!doc.exists) {
                        $('error-msg').textContent = 'كود اللعبة غير موجود';
                        if (unsubscribe) { unsubscribe(); unsubscribe = null; }
                        return;
                    }
                    gameId = code;
                    store('ipadCode', code); store('ipadTeam', myTeam); store('ipadName', myName);
                    $('code-label').textContent = code;
                    $('login-screen').style.display = 'none';
                    $('main-screen').style.display = 'block';
                    joinAsPlayer(code);
                }
                if (doc.exists) render(doc.data());
            }, function () {
                $('connect-btn').disabled = false;
                $('error-msg').textContent = 'تعذر الاتصال، تأكد من الإنترنت';
            });
        }

        function joinAsPlayer(code) {
            var sessionRef = db.collection('sessions').doc(code);
            var savedId = load('ipadPlayerId_' + code);
            var attach = function (ref) {
                myPlayerRef = ref;
                store('ipadPlayerId_' + code, ref.id);
                if (unsubscribePlayer) unsubscribePlayer();
                unsubscribePlayer = ref.onSnapshot(function (d) {
                    if (!d.exists && gameId === code) { alert('تمت إزالتك من الفريق بواسطة المضيف.'); leaveGame(true); }
                });
            };
            var create = function () {
                sessionRef.collection('players').add({ name: myName, team: myTeam, joinedAt: firebase.firestore.FieldValue.serverTimestamp() })
                    .then(attach).catch(function () {});
            };
            if (savedId) {
                var ref = sessionRef.collection('players').doc(savedId);
                ref.get().then(function (d) {
                    if (d.exists) { ref.update({ name: myName, team: myTeam }).then(function () { attach(ref); }); } else { create(); }
                }).catch(create);
            } else {
                create();
            }
            updateMyTeamChip();
        }

        function leaveGame(fromKick) {
            if (unsubscribePlayer) { unsubscribePlayer(); unsubscribePlayer = null; }
            if (myPlayerRef && !fromKick) { myPlayerRef.delete().catch(function () {}); }
            if (gameId) unstore('ipadPlayerId_' + gameId);
            myPlayerRef = null;
            if (unsubscribe) { unsubscribe(); unsubscribe = null; }
            stopTyping();
            gameId = null; currentSeq = null; selectedIndex = null; sent = false;
            unstore('ipadCode');
            $('main-screen').style.display = 'none';
            $('login-screen').style.display = 'flex';
            $('code-input').value = '';
        }

        // ---------- letter-by-letter question ----------
        function startTyping(text) {
            stopTyping();
            typedText = text; typedCount = 0; typedFrozen = false;
            $('q-text').textContent = '';
            typeTimer = setInterval(function () {
                typedCount++;
                $('q-text').textContent = typedText.slice(0, typedCount);
                if (typedCount >= typedText.length) stopTyping();
            }, TYPE_SPEED_MS);
        }

        function stopTyping() { if (typeTimer) { clearInterval(typeTimer); typeTimer = null; } }

        function freezeTyping(chars) {
            stopTyping();
            typedFrozen = true;
            $('q-text').textContent = typedText.slice(0, chars);
        }

        // ---------- render session state ----------
        function render(data) {
            applyTeams(data.teams);

            var banner = $('winner-banner');
            if (data.state === 'LOCKED' && data.winnerName) {
                var wt = data.winnerTeam && teamsInfo[data.winnerTeam] ? ' (' + teamsInfo[data.winnerTeam].name + ')' : '';
                banner.textContent = '🚨 ' + data.winnerName + wt + ' ضغط أولاً!';
                banner.style.borderColor = data.winnerTeam && teamsInfo[data.winnerTeam] ? teamsInfo[data.winnerTeam].color : '';
                banner.style.display = 'block';
            } else {
                banner.style.display = 'none';
            }

            buzz.locked = data.state === 'LOCKED' && !!data.winnerTeam;
            buzz.team = data.winnerTeam || '';
            timeUp = !!data.timeUp || data.state === 'TIMEUP';

            var q = data.question;
            if (!q) {
                stopTyping();
                currentSeq = null; selectedIndex = null; sent = false;
                $('question-view').style.display = 'none';
                $('waiting').style.display = 'block';
                return;
            }

            $('waiting').style.display = 'none';
            $('question-view').style.display = 'block';

            if (q.seq !== currentSeq) {
                currentSeq = q.seq; selectedIndex = null; sent = false;
                $('letter-chip').textContent = q.letter || '';
                $('q-text').dir = 'auto';
                typedText = q.text || '';
                if (typeof data.frozenChars === 'number') { freezeTyping(data.frozenChars); } else { startTyping(typedText); }
                var box = $('options');
                box.innerHTML = '';
                (q.options || []).forEach(function (text, i) {
                    var b = document.createElement('button');
                    b.className = 'opt';
                    b.dir = 'auto';
                    b.textContent = text;
                    b.onclick = function () { selectOption(i); };
                    box.appendChild(b);
                });
                $('feedback').textContent = '';
            } else if (typeof data.frozenChars === 'number' && !typedFrozen) {
                freezeTyping(data.frozenChars);
            }

            applyReveal(data.reveal, data.winnerTeam);
            updateControls();
        }

        function canAnswer() { return !timeUp && buzz.locked && buzz.team === myTeam; }

        function applyReveal(reveal, winnerTeam) {
            var btns = $('options').children;
            for (var i = 0; i < btns.length; i++) btns[i].classList.remove('correct', 'wrong');
            if (reveal && reveal.seq === currentSeq) {
                sent = true;
                if (btns[reveal.correctIndex]) btns[reveal.correctIndex].classList.add('correct');
                if (reveal.picked !== reveal.correctIndex && btns[reveal.picked]) btns[reveal.picked].classList.add('wrong');
                var scoringTeam = winnerTeam || myTeam;
                $('feedback').textContent = reveal.picked === reveal.correctIndex
                    ? '✅ إجابة صحيحة — النقطة لـ ' + teamsInfo[scoringTeam].name
                    : '❌ إجابة خاطئة';
            }
        }

        function selectOption(i) {
            if (sent || !canAnswer()) return;
            selectedIndex = i;
            updateControls();
        }

        function updateControls() {
            var can = canAnswer();
            if (!can && !sent) selectedIndex = null;
            var btns = $('options').children;
            for (var i = 0; i < btns.length; i++) {
                btns[i].classList.toggle('selected', !sent && can && i === selectedIndex);
                btns[i].disabled = sent || !can;
            }
            $('confirm-btn').disabled = sent || !can || selectedIndex === null;

            var st = $('answer-status');
            if (sent) {
                st.textContent = ''; st.className = '';
            } else if (timeUp) {
                st.textContent = '⏰ انتهى الوقت — لا يمكن الإجابة';
                st.className = 'blocked';
            } else if (can) {
                st.textContent = '🔔 فريقك ضغط أولاً — اختر الإجابة';
                st.className = 'ready';
            } else if (buzz.locked && teamsInfo[buzz.team]) {
                st.textContent = '🔒 ' + teamsInfo[buzz.team].name + ' ضغط أولاً — لا يمكنك الإجابة';
                st.className = 'blocked';
            } else {
                st.textContent = '⏳ بانتظار ضغط الجرس من فريقك...';
                st.className = '';
            }
        }

        // ---------- actions sent to the host ----------
        function confirmPick() {
            if (sent || !canAnswer() || selectedIndex === null || !gameId || currentSeq === null) return;
            sent = true;
            var idx = selectedIndex;
            $('feedback').textContent = 'تم إرسال الإجابة... بانتظار المضيف';
            updateControls();
            db.collection('sessions').doc(gameId).collection('picks').add({
                seq: currentSeq,
                index: idx,
                team: myTeam,
                name: myName,
                ts: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(function () {
                sent = false;
                $('feedback').textContent = 'فشل الإرسال، حاول مرة أخرى';
                updateControls();
            });
        }

        // ---------- auto reconnect ----------
        (function autoConnect() {
            var code = new URLSearchParams(location.search).get('code') || load('ipadCode');
            var savedTeam = load('ipadTeam'); var savedName = load('ipadName');
            if (savedName) $('name-input').value = savedName;
            if (savedTeam === 'green' || savedTeam === 'red') pickLoginTeam(savedTeam);
            if (!code || !/^\d{4}$/.test(code)) return;
            $('code-input').value = code;
            fetchTeamsFor(code);
            if (myTeam) { myName = $('name-input').value.trim() || 'آيباد'; connect(code); }
        })();
    </script>
</body>
</html>
